<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DYNASTY</title>
<style>
:root{color-scheme:light;--cream:#fbf7ef;--pink:#e8b9c5;--gold:#c69b50}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream)}
body{min-height:100svh;display:grid;place-items:center;font-family:system-ui,sans-serif}
main{width:100%;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.avatar{width:min(68vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 34%,#fff 0 35%,#f3dce0 36% 70%,#ead3c4 71%);border:7px solid #fff;box-shadow:0 10px 35px #b99b8730;overflow:hidden}
.avatar svg{width:82%;height:82%}
.earn{display:flex;align-items:center;gap:9px;color:var(--gold);font-size:clamp(25px,7vw,36px);font-weight:700;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.coin{width:25px;height:25px;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(135deg,#f9e4a0,#c99b45);border:2px solid #fff;box-shadow:0 2px 5px #9c773533}
.coin:after{content:"";width:7px;height:7px;border:2px solid #fff4;border-radius:50%}
</style>
</head>
<body>
<main>
<div class="avatar" aria-label="avatar nhân vật">
<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
<path d="M35 229c4-48 34-73 85-73s81 25 85 73" fill="#d9aeb8"/>
<path d="M73 96c0-54 19-77 50-77s50 23 50 77v43c-9 32-27 48-50 48s-41-16-50-48z" fill="#f4c9aa"/>
<path d="M67 103C53 45 79 12 123 12c45 0 68 34 53 91-10-29-25-45-52-48-19 19-37 25-57 27z" fill="#59433f"/>
<path d="M69 89c-8 47 2 83 24 105-34-11-48-48-39-89zM171 88c8 48-2 84-24 106 34-12 48-49 39-90z" fill="#59433f"/>
<ellipse cx="99" cy="112" rx="5" ry="7" fill="#59433f"/><ellipse cx="141" cy="112" rx="5" ry="7" fill="#59433f"/>
<path d="M109 139q11 9 22 0" fill="none" stroke="#b96f72" stroke-width="4" stroke-linecap="round"/>
<path d="M84 165q36 24 72 0l18 64H66z" fill="#fff7f0"/>
<path d="M91 169l29 26 29-26" fill="none" stroke="#d6a2ad" stroke-width="5"/>
</svg>
</div>
<div class="earn"><span class="coin"></span><span id="income">20</span></div>
</main>
<script>
let income=20;
const el=document.getElementById('income');
function nextDay(){income+=20;el.textContent=income.toLocaleString('vi-VN');}
setInterval(nextDay,18000);
</script>
</body>
</html>
