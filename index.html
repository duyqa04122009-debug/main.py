<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fbf7f5"><title>DYNASTY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fbf7f5;font-family:Georgia,serif;color:#98798a}
body{min-height:100svh;display:grid;place-items:center}.screen{width:min(100%,520px);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 42%,#fff 0%,#fffaf9 48%,#f8eff1 100%)}
.avatar{width:min(68vw,290px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f8e7ec,#fff8f2);border:7px solid #fff;box-shadow:0 12px 45px #cba8b833,0 0 0 1px #ead8df;overflow:hidden}
.avatar span{font-family:system-ui;font-size:clamp(110px,38vw,190px);line-height:1;filter:drop-shadow(0 5px 5px #98798a22)}
.earn{margin-top:30px;text-align:center;font:600 25px Georgia,serif;color:#b18a61;letter-spacing:.4px}.coin{font-family:system-ui;font-size:19px;margin-right:5px}
</style></head><body><main class="screen"><div class="avatar"><span id="face">👧🏻</span></div><div class="earn"><span class="coin">🪙</span><span id="money">20</span></div></main>
<script>
const key='dynasty-minimal-save';let s={age:18,gender:'female',gold:0,day:1,month:1,year:18};
try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
function face(){const a=s.age,g=s.gender;let v;if(a<3)v='👶🏻';else if(a<13)v=g==='female'?'👧🏻':'👦🏻';else if(a<25)v=g==='female'?'👩🏻':'👨🏻';else if(a<50)v=g==='female'?'👩🏻':'👨🏻';else if(a<70)v=g==='female'?'👩🏼‍🦳':'👨🏼‍🦳';else v=g==='female'?'👵🏻':'👴🏻';document.getElementById('face').textContent=v}
function paint(){face();document.getElementById('money').textContent=s.gold.toLocaleString('vi-VN');localStorage.setItem(key,JSON.stringify(s))}
function tick(){s.day++;s.gold+=20;if(s.day>30){s.day=1;s.month++;if(s.month>12){s.month=1;s.year++;s.age++}}paint()}
paint();setInterval(tick,18000);
</script></body></html>
